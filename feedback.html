<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自习室意见反馈</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", -apple-system, BlinkMacSystemFont, sans-serif;
        }
        body {
            background-color: #f0f7ff;
            padding: 40px 20px;
            min-height: 100vh;
        }
        .feedback-card {
            max-width: 520px;
            margin: 0 auto;
            background: #ffffff;
            padding: 36px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,60,130,0.08);
        }
        h1 {
            text-align: center;
            color: #194080;
            margin-bottom: 32px;
            font-size: 26px;
        }
        .form-item {
            margin-bottom: 22px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #222;
            font-weight: 500;
        }
        input, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd7e8;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
        }
        input:focus, textarea:focus {
            border-color: #3478e8;
        }
        textarea {
            min-height: 120px;
            resize: vertical;
        }
        .cf-turnstile {
            margin: 12px 0 24px;
        }
        #submitBtn {
            width: 100%;
            padding: 14px;
            background-color: #2563eb;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #submitBtn:disabled {
            background-color: #82a8ee;
            cursor: not-allowed;
        }
        #toast {
            position: fixed;
            left: 50%;
            top: 30px;
            transform: translateX(-50%);
            background: #222;
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s;
            z-index: 999;
        }
        #toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="feedback-card">
        <h1>自习室意见反馈</h1>
        <form id="feedbackForm">
            <div class="form-item">
                <label>您的姓名 <span style="color:#f04438">*</span></label>
                <input type="text" id="name" required placeholder="请输入姓名">
            </div>
            <div class="form-item">
                <label>联系电话</label>
                <input type="tel" id="phone" placeholder="选填，方便回访">
            </div>
            <div class="form-item">
                <label>反馈内容 <span style="color:#f04438">*</span></label>
                <textarea id="content" required placeholder="请详细描述你的意见或建议"></textarea>
            </div>
            <div class="cf-turnstile" data-sitekey="填入你的sitekey"></div>
            <button type="submit" id="submitBtn">提交反馈</button>
        </form>
    </div>

    <div id="toast"></div>

    <script src="https://challenges.cloudflare.com/turnstile/v0/siteverify" defer></script>
    <script>
        const form = document.getElementById("feedbackForm");
        const submitBtn = document.getElementById("submitBtn");
        const toastDom = document.getElementById("toast");

        function showToast(msg) {
            toastDom.innerText = msg;
            toastDom.classList.add("show");
            setTimeout(() => toastDom.classList.remove("show"), 2500);
        }

        form.addEventListener("submit", async function(e) {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = "提交中...";

            try {
                const token = window.turnstile.getResponse();
                if (!token) {
                    showToast("请先完成人机验证");
                    submitBtn.disabled = false;
                    submitBtn.textContent = "提交反馈";
                    return;
                }

                const verifyRes = await fetch("/verify-turnstile", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ token })
                });
                const verifyData = await verifyRes.json();
                if (!verifyData.success) {
                    showToast("人机验证失败，请重试");
                    window.turnstile.reset();
                    submitBtn.disabled = false;
                    submitBtn.textContent = "提交反馈";
                    return;
                }

                const payload = {
                    name: document.getElementById("name").value.trim(),
                    phone: document.getElementById("phone").value.trim(),
                    content: document.getElementById("content").value.trim()
                };
                const submitRes = await fetch("/submit", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });
                const submitResult = await submitRes.json();

                if (submitResult.success) {
                    showToast("提交成功！感谢反馈");
                    form.reset();
                    window.turnstile.reset();
                } else {
                    showToast("提交失败：" + (submitResult.errMsg || submitResult.msg || "服务器异常"));
                }
            } catch (err) {
                console.error(err);
                showToast("网络异常，请稍后重试");
            }

            submitBtn.disabled = false;
            submitBtn.textContent = "提交反馈";
        });
    </script>
</body>
</html>
