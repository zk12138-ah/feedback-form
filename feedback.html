<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自习室意见反馈</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, sans-serif;
        }
        body {
            background-color: #f0f7ff;
            padding: 40px 20px;
            min-height: 100vh;
        }
        .feedback-card {
            max-width: 520px;
            margin: 0 auto;
            background: #ffffff;
            padding: 36px;
            border-radius: 16px;
            box-shadow: 0 4px 18px rgba(0, 80, 180, 0.1);
        }
        .title {
            text-align: center;
            color: #1a4b94;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .form-item {
            margin-bottom: 22px;
        }
        .form-item label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        .form-item label .required {
            color: #ff4d4f;
        }
        .form-item input,
        .form-item textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d0e0f5;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-item input:focus,
        .form-item textarea:focus {
            border-color: #3678d3;
        }
        .form-item textarea {
            min-height: 120px;
            resize: vertical;
        }
        .cf-turnstile {
            margin: 12px 0 24px;
        }
        #submit-btn {
            width: 100%;
            padding: 13px;
            background-color: #2b6bcd;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #submit-btn:disabled {
            background-color: #80a8e0;
            cursor: not-allowed;
        }
        #toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            background: rgba(0, 0, 0, 0.75);
            color: white;
            border-radius: 8px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        #toast.show {
            opacity: 1;
        }
    </style>
    <!-- Turnstile 官方脚本 -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" defer></script>
</head>
<body>
    <div class="feedback-card">
        <h2 class="title">自习室意见反馈</h2>

        <div class="form-item">
            <label>姓名 <span class="required">*</span></label>
            <input type="text" id="username" placeholder="请输入您的姓名，建议输入昵称！！！">
        </div>

        <div class="form-item">
            <label>联系电话</label>
            <input type="tel" id="phone" placeholder="选填，方便我们回复您">
        </div>

        <div class="form-item">
            <label>反馈内容 <span class="required">*</span></label>
            <textarea id="content" placeholder="请详细描述遇到的问题或建议..."></textarea>
        </div>

        <!-- Turnstile 验证组件 -->
        <div class="cf-turnstile" data-sitekey="0x4AAAAAAEDV5_MjcqtRkXAg"></div>

        <button id="submit-btn" type="button">提交反馈</button>
    </div>

    <div id="toast"></div>

    <script>
        const API_PATH = "/submit";
        const VERIFY_PATH = "/verify-turnstile";

        const submitBtn = document.getElementById("submit-btn");
        const toastEl = document.getElementById("toast");

        submitBtn.addEventListener("click", submitData);

        function showToast(text) {
            toastEl.innerText = text;
            toastEl.classList.add("show");
            setTimeout(() => {
                toastEl.classList.remove("show");
            }, 2500);
        }

        function resetCaptcha() {
            if (window.turnstile) {
                window.turnstile.reset(document.querySelector(".cf-turnstile"));
            }
        }

        async function submitData() {
            const name = document.getElementById("username").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const content = document.getElementById("content").value.trim();

            // 基础校验
            if (!name) {
                showToast("请填写姓名");
                return;
            }
            if (!content) {
                showToast("请填写反馈内容");
                return;
            }

            // 获取 Turnstile token
            let token = "";
            try {
                if (window.turnstile) {
                    token = window.turnstile.getResponse();
                }
            } catch (e) {
                console.error("获取验证token失败:", e);
            }

            if (!token) {
                showToast("请先完成人机验证");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "提交中...";

            try {
                // 第一步：校验人机验证
                const verifyRes = await fetch(VERIFY_PATH, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token })
                });

                if (!verifyRes.ok) {
                    throw new Error(`验证接口异常，状态码：${verifyRes.status}`);
                }

                const verifyData = await verifyRes.json();
                if (!verifyData.success) {
                    throw new Error("人机验证失败，请重新勾选");
                }

                // 第二步：提交反馈
                const submitRes = await fetch(API_PATH, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, phone, content })
                });

                const submitData = await submitRes.json();

                if (submitData.success) {
                    showToast("提交成功！感谢您的反馈");
                    // 清空表单
                    document.getElementById("username").value = "";
                    document.getElementById("phone").value = "";
                    document.getElementById("content").value = "";
                    resetCaptcha();
                } else {
                    showToast(submitData.errMsg || "提交失败，请稍后重试");
                    resetCaptcha();
                }

            } catch (err) {
                console.error("请求错误:", err);
                showToast(err.message || "网络请求失败，请稍后重试");
                resetCaptcha();
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "提交反馈";
            }
        }
    </script>

    <div style="clear:both; text-align:center; padding:30px 20px 50px; color:#546478; font-size:17px; letter-spacing:1.5px; font-weight:300;">
    伏案追逐理想，亦值得一方舒适天地
    </div>
    
    <div class="copyright" style="text-align:center;color:#666;font-size:13px;padding:20px 10px;">
    © 2026 青云自习室 保留所有权利

</body>

</div>
</html>
