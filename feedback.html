<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自习室意见反馈</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", -apple-system, BlinkMacSystemFont, sans-serif;
        }
        body {
            background-color: #f0f7ff;
            padding: 40px 20px;
            min-height: 100vh;
        }
        .feedback-card {
            max-width: 520px;
            margin: 0 auto;
            background: #ffffff;
            padding: 36px;
            border-radius: 16px;
            box-shadow: 0 4px 18px rgba(0,80,180,0.1);
        }
        .feedback-card h1 {
            text-align: center;
            color: #1a4b94;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .form-item {
            margin-bottom: 22px;
        }
        .form-item label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        .form-item input,
        .form-item textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d0e0f5;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
        }
        .form-item input:focus,
        .form-item textarea:focus {
            border-color: #3678d3;
        }
        .form-item textarea {
            min-height: 120px;
            resize: vertical;
        }
        /* Turnstile容器 */
        .cf-turnstile {
            margin:10px 0 24px;
        }
        #submit-btn {
            width: 100%;
            padding: 13px;
            background-color: #2b6bcd;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #submit-btn:disabled {
            background-color: #80a8e0;
            cursor: not-allowed;
        }
        #toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            background: rgba(0,0,0,0.75);
            color: white;
            border-radius: 8px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        #toast.show {
            opacity: 1;
        }
    </style>
    <!-- ✅重点：已经替换为同源代理地址 -->
    <script src="/turnstile-proxy" defer></script>
</head>
<body>
    <div class="feedback-card">
        <h1>自习室意见反馈</h1>
        <form id="feedbackForm">
            <div class="form-item">
                <label>姓名 *</label>
                <input type="text" id="name" required placeholder="请输入您的姓名">
            </div>
            <div class="form-item">
                <label>联系电话</label>
                <input type="tel" id="phone" placeholder="选填，方便我们回复您">
            </div>
            <div class="form-item">
                <label>反馈内容 *</label>
                <textarea id="content" required placeholder="请详细描述您的意见或建议"></textarea>
            </div>

            <!-- 替换成你自己Turnstile组件的Sitekey -->
            <div class="cf-turnstile" data-sitekey="0x4AAAAAAEDV5_MjcqtRkXAg"></div>

            <button id="submit-btn" type="submit">提交反馈</button>
        </form>
    </div>

    <div id="toast"></div>

    <script>
        const form = document.getElementById('feedbackForm');
        const submitBtn = document.getElementById('submit-btn');
        const toast = document.getElementById('toast');

        function showToast(text) {
            toast.innerText = text;
            toast.classList.add("show");
            setTimeout(()=>toast.classList.remove("show"),2500);
        }

        form.addEventListener('submit', async function(e){
            e.preventDefault();
            submitBtn.disabled = true;

            // 获取人机验证token
            let token;
            try {
                token = turnstile.getResponse();
            } catch(err) {
                showToast("人机验证组件加载失败，请刷新页面重试");
                submitBtn.disabled = false;
                return;
            }

            if(!token){
                showToast("请先完成人机验证");
                submitBtn.disabled = false;
                return;
            }

            try {
                // 第一步：校验人机验证
                const verifyRes = await fetch("/verify-turnstile", {
                    method:"POST",
                    headers:{"Content-Type":"application/json"},
                    body: JSON.stringify({token})
                });
                const verifyData = await verifyRes.json();
                if(!verifyData.success){
                    showToast("人机验证失败，请重新勾选");
                    turnstile.reset();
                    submitBtn.disabled = false;
                    return;
                }

                // 第二步：提交反馈数据
                const payload = {
                    name: document.getElementById("name").value.trim(),
                    phone: document.getElementById("phone").value.trim(),
                    content: document.getElementById("content").value.trim()
                };
                const submitRes = await fetch("/submit", {
                    method:"POST",
                    headers:{"Content-Type":"application/json"},
                    body: JSON.stringify(payload)
                });
                const submitData = await submitRes.json();

                if(submitData.success){
                    showToast("提交成功！感谢您的反馈");
                    form.reset();
                    turnstile.reset();
                }else{
                    showToast(submitData.errMsg || "提交失败，请稍后重试");
                }
            } catch (err) {
                showToast("网络异常，请检查网络后重试");
                console.error(err);
            }
            submitBtn.disabled = false;
        });
    </script>
</body>
</html>
