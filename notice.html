<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最新通知 | 青云自习室</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #f8fafe;
            padding: 30px 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .back-btn {
            display: inline-block;
            text-decoration: none;
            color:#1a3480;
            font-size:16px;
            margin-bottom:24px;
        }
        .title-box {
            text-align:center;
            margin-bottom:24px;
        }
        .title-box h1{
            color:#1a3480;
            font-size:32px;
            letter-spacing:2px;
        }
        .content-card {
            background:#ffffff;
            border-radius:16px;
            padding:28px;
            box-shadow:0 2px 12px rgba(0,0,0,0.06);
        }
        .notice-item{
            border-bottom: 1px solid #eee;
            padding-bottom:18px;
            margin-bottom:18px;
        }
        .notice-item:last-child{
            border-bottom:none;
            margin-bottom:0;
            padding-bottom:0;
        }
        .notice-time{
            font-size:14px;
            color:#888;
            margin-bottom:6px;
        }
        .notice-title{
            font-size:19px;
            color:#1a3480;
            margin-bottom:8px;
        }
        .notice-text{
            font-size:16px;
            line-height:1.75;
            color:#333;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="./index.html" class="back-btn">← 返回首页</a>
        <div class="title-box">
            <h1>最新通知</h1>
        </div>

        <div class="content-card">
            <div class="notice-item">
                <div class="notice-time">2026-08-01</div>
                <div class="notice-title">暑期营业时间调整</div>
                <div class="notice-text">暑期客流增多，自习室常规营业时间保持8:00-23:00，合理安排出行学习。</div>
            </div>

            <div class="notice-item">
                <div class="notice-time">2026-08-01</div>
                <div class="notice-title">暂无更新</div>
                <div class="notice-text">暂无更新</div>
            </div>

            <div class="notice-item">
                <div class="notice-time">公告持续更新中</div>
                <div class="notice-title">意见反馈渠道正常开放</div>
                <div class="notice-text">大家有环境、设施相关建议，可通过首页【意见反馈】提交表单。</div>
            </div>
        </div>
    </div>
</body>
</html>
