<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>青云自习室</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #ffffff;
            background-image: url("logo-bg.png");
            background-repeat: no-repeat;
            background-position: top 120px center;
            background-size: 320px auto;
            min-height: 100vh;
        }

        /* 标题区域【最终定稿样式】 */
        .header-logo-area {
            text-align:center;
            margin-top:280px;
            padding:0 10px;
        }
        .main-title {
            font-size:56px;
            color:#1a3480;
            font-weight:700;
            letter-spacing:8px;
        }
        .en-title {
            font-size:26px;
            color:#222;
            margin:14px 0;
            letter-spacing:2px;
        }
        .tagline {
            font-size:28px;
            color:#1a3480;
            margin-top:12px;
            letter-spacing:6px;
        }

        /* 功能按钮区域 */
        .func-wrap {
            padding:36px 16px 16px;
        }
        .func-row {
            display:grid;
            grid-template-columns: repeat(5, 1fr);
            gap:10px;
        }
        .func-item {
            text-align:center;
        }
        .func-item a {
            text-decoration: none;
            display:block;
        }
        .circle-btn {
            width:70px;
            height:70px;
            border-radius:50%;
            background:#3488eb;
            margin:0 auto 10px;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#fff;
            font-size:28px;
            /* 灵动动画核心 */
            transition: transform 0.22s ease, box-shadow 0.22s ease;
            box-shadow: 0 3px 8px rgba(52, 136, 235, 0.25);
        }
        /* 悬浮效果 */
        .circle-btn:hover {
            transform: translateY(-5px) scale(1.06);
            box-shadow: 0 7px 16px rgba(52, 136, 235, 0.35);
        }
        /* 点击按压回弹 */
        .circle-btn:active {
            transform: translateY(0) scale(0.94);
            box-shadow: 0 2px 4px rgba(52, 136, 235, 0.2);
        }
        .func-name {
            font-size:15px;
            color:#222;
        }
        .func-desc {
            text-align:center;
            margin-top:14px;
            color:#777;
            font-size:15px;
        }

        /* 两大卡片：热门服务 / 最新通知 */
        .card-container {
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:16px;
            padding:24px 16px;
        }
        .card-link {
            text-decoration: none;
        }
        .card {
            background:#fff;
            border-radius:16px;
            box-shadow:0 2px 12px rgba(0,0,0,0.06);
            padding:24px 20px;
            /* 卡片动画 */
            transition: transform 0.24s ease, box-shadow 0.24s ease;
        }
        .card:hover{
            transform: translateY(-4px);
            box-shadow:0 8px 20px rgba(26, 52, 128, 0.12);
        }
        .card:active{
            transform: scale(0.97);
        }
        .card h3 {
            font-size:24px;
            margin-bottom:16px;
            color:#1a3480;
        }
        .card p {
            font-size:16px;
            color:#333;
            line-height:1.7;
        }
    </style>
</head>
<body>
    <!-- Logo标题区域 -->
    <div class="header-logo-area">
        <h1 class="main-title">青云自习室</h1>
        <div class="en-title">Qingyun Study Room</div>
        <div class="tagline">自习 | 备考 | 阅读</div>
    </div>

    <!-- 功能入口 -->
    <div class="func-wrap">
        <div class="func-row">
            <div class="func-item">
                <a href="feedback.html">
                    <div class="circle-btn">🗨</div>
                </a>
                <div class="func-name">意见反馈</div>
            </div>
            <div class="func-item">
                <a href="intro.html">
                    <div class="circle-btn">📖</div>
                </a>
                <div class="func-name">自习室简介</div>
            </div>
            <div class="func-item">
                <a href="rule.html">
                    <div class="circle-btn">📄</div>
                </a>
                <div class="func-name">使用须知</div>
            </div>
            <div class="func-item">
                <a href="contact.html">
                    <div class="circle-btn">📍</div>
                </a>
                <div class="func-name">联系我们</div>
            </div>
            <div class="func-item">
                <a href="developer.html">
                    <div class="circle-btn">👨‍💻</div>
                </a>
                <div class="func-name">开发人员</div>
            </div>
        </div>
        <div class="func-desc">自习室预约、意见反馈、服务指南一站式入口</div>
    </div>

    <!-- 卡片区域（点击跳转） -->
    <div class="card-container">
        <a href="service.html" class="card-link">
            <div class="card">
                <h3>热门服务</h3>
                <p>智能选座 一键预约<br>超时提醒 贴心服务</p>
            </div>
        </a>
        <a href="notice.html" class="card-link">
            <div class="card">
                <h3>最新通知</h3>
                <p>暑期营业时间调整<br>新增通宵自习区域</p>
            </div>
        </a>
    </div>

</body>
</html>
