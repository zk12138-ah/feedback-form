<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>青云自习室</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #ffffff;
            background-image: url("logo-bg.png");
            background-repeat: no-repeat;
            background-position: top 120px center;
            background-size: 320px auto;
            min-height: 100vh;
            padding-bottom: 110px;
        }
        /* 顶部搜索栏 */
        .top-bar {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            gap:12px;
        }
        .search-box {
            flex:1;
            border:1px solid #c5d2e8;
            border-radius:99px;
            padding:10px 16px;
            display:flex;
            align-items:center;
            gap:8px;
        }
        .search-box .check-icon {
            color:#206bc9;
            font-weight:bold;
        }
        .search-box span {
            font-size:17px;
            color:#222;
        }
        .top-icon {
            width:36px;
            height:36px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:22px;
        }

        /* 标题区域 */
        .header-logo-area {
            text-align:center;
            margin-top:140px;
            padding:0 10px;
        }
        .main-title {
            font-size:56px;
            color:#1a3480;
            font-weight:500;
            letter-spacing:4px;
        }
        .en-title {
            font-size:26px;
            color:#222;
            margin:8px 0;
        }
        .tagline {
            font-size:28px;
            color:#1a3480;
            letter-spacing:2px;
        }

        /* 功能按钮区 4个圆形按钮 */
        .func-wrap {
            padding:36px 16px 16px;
        }
        .func-row {
            display:grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap:12px;
        }
        .func-item {
            text-align:center;
        }
        .circle-btn {
            width:76px;
            height:76px;
            border-radius:50%;
            background:#3488eb;
            margin:0 auto 10px;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#fff;
            font-size:32px;
        }
        .func-name {
            font-size:16px;
            color:#222;
        }
        .func-desc {
            text-align:center;
            margin-top:14px;
            color:#777;
            font-size:15px;
        }

        /* 两大卡片：热门服务 / 最新通知 */
        .card-container {
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:16px;
            padding:24px 16px;
        }
        .card {
            background:#fff;
            border-radius:16px;
            box-shadow:0 2px 12px rgba(0,0,0,0.06);
            padding:24px 20px;
        }
        .card h3 {
            font-size:24px;
            margin-bottom:16px;
        }
        .card p {
            font-size:16px;
            color:#333;
            line-height:1.7;
        }

        /* 底部导航栏 */
        .footer-nav {
            position:fixed;
            bottom:0;
            left:0;
            width:100%;
            background:#fff;
            display:grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            padding:10px 0 12px;
            border-top:1px solid #eee;
        }
        .nav-item {
            text-align:center;
        }
        .nav-icon {
            font-size:26px;
            margin-bottom:4px;
        }
        .nav-text {
            font-size:15px;
        }
        .nav-item.active .nav-text{
            color:#206bc9;
        }
    </style>
</head>
<body>
    <!-- 顶部栏 -->
    <div class="top-bar">
        <div class="search-box">
            <span class="check-icon">☑</span>
            <span>自习室服务平台</span>
        </div>
        <div class="top-icon">🔍</div>
        <div class="top-icon">⟳</div>
        <div class="top-icon">💼</div>
    </div>

    <!-- Logo标题区域 -->
    <div class="header-logo-area">
        <h1 class="main-title">青云自习室</h1>
        <div class="en-title">Qingyun Study Room</div>
        <div class="tagline">自习 | 备考 | 阅读</div>
    </div>

    <!-- 四大功能入口 -->
    <div class="func-wrap">
        <div class="func-row">
            <div class="func-item">
                <a href="feedback.html">
                    <div class="circle-btn">🗨</div>
                </a>
                <div class="func-name">意见反馈</div>
            </div>
            <div class="func-item">
                <a href="intro.html">
                    <div class="circle-btn">📖</div>
                </a>
                <div class="func-name">自习室简介</div>
            </div>
            <div class="func-item">
                <a href="rule.html">
                    <div class="circle-btn">📄</div>
                </a>
                <div class="func-name">使用须知</div>
            </div>
            <div class="func-item">
                <a href="contact.html">
                    <div class="circle-btn">📍</div>
                </a>
                <div class="func-name">联系我们</div>
            </div>
        </div>
        <div class="func-desc">自习室预约、意见反馈、服务指南一站式入口</div>
    </div>

    <!-- 双卡片区域 -->
    <div class="card-container">
        <div class="card">
            <h3>热门服务</h3>
            <p>智能选座 一键预约<br>超时提醒 贴心服务</p>
        </div>
        <div class="card">
            <h3>最新通知</h3>
            <p>暑期自习室开放时间调整<br>新增通宵自习区域</p>
        </div>
    </div>

    <!-- 底部导航 -->
    <div class="footer-nav">
        <div class="nav-item active">
            <div class="nav-icon">🏠</div>
            <div class="nav-text">首页</div>
        </div>
        <div class="nav-item">
            <div class="nav-icon">📊</div>
            <div class="nav-text">服务</div>
        </div>
        <div class="nav-item">
            <div class="nav-icon">💬</div>
            <div class="nav-text">消息</div>
        </div>
        <div class="nav-item">
            <div class="nav-icon">👤</div>
            <div class="nav-text">我的</div>
        </div>
    </div>
</body>
</html>
