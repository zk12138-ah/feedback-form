<style>
   * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, sans-serif;
    }

  
  .seat-map-section {
    max-width: 820px;
    margin: 40px auto;
    padding: 32px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 4px 18px rgba(0, 80, 180, 0.08);
  }
  .seat-map-section h3 {
    color: #1a4b94;
    font-size: 22px;
    margin-bottom: 8px;
  }
  .seat-notice{
    text-align:center;
    color:#1a4b94;
    font-size:22px;
    margin-top:16px;
  }
  .tel-link,.wx-copy{
    color:#1a4b94;
    text-decoration:underline;
    cursor:pointer;
  }
  .tel-link:active,.wx-copy:active{
    opacity:0.65;
  }
  .copy-toast{
    position:fixed;
    top:45%;
    left:50%;
    transform:translate(-50%,-50%);
    background:rgba(0,0,0,0.72);
    color:#fff;
    padding:10px 24px;
    border-radius:8px;
    z-index:9999;
    display:none;
  }
  .copy-toast.show{
    display:block;
  }

  .seat-summary {
    display: flex;
    gap: 24px;
    margin-bottom: 20px;
    color: #555;
    font-size: 15px;
  }
  .seat-summary strong {
    color: #1a4b94;
    font-size: 18px;
    margin-right: 4px;
  }
  .seat-map-wrap {
    width: 100%;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    background: #f8fafc;
    overflow: hidden;
  }
  #seatMap {
    width: 100%;
    height: auto;
    display: block;
  }
    .seat {
    cursor: pointer;
    transition: transform 0.22s ease-out, opacity 0.2s ease;
    transform-origin: center center;
  }
  .seat:hover {
    transform: scale(1.035);
  }
  .seat-available { fill: #22c55e; stroke: #16a34a; stroke-width: 2; }
  .seat-occupied { fill: #ef4444; stroke: #dc2626; stroke-width: 2; }
  .seat-maintenance { fill: #94a3b8; stroke: #64748b; stroke-width: 2; }

  .seat-legend {
    display: flex;
    gap: 24px;
    margin-top: 16px;
    font-size: 14px;
    color: #475569;
    justify-content: center;
  }
  .seat-legend .dot {
    display: inline-block;
    width: 14px;
    height: 14px;
    border-radius: 3px;
    margin-right: 6px;
    vertical-align: middle;
  }
  .dot.available { background: #22c55e; }
  .dot.occupied { background: #ef4444; }
  .dot.maintenance { background: #94a3b8; }

 .seat-tooltip {
    position: fixed;
    background: rgba(15, 23, 42, 0.92);
    color: #fff;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.6;
    pointer-events: none;
    z-index: 999;
    opacity: 0;
    transition: opacity 0.18s ease;
    white-space: nowrap;
                }
  .seat-tooltip.active {
    display: block;
    opacity: 1;
                      }
  .seat-tooltip .label { color: #94a3b8; margin-right: 6px; }
</style>

<div class="seat-map-section">
  <h3>自习室座位实时状态</h3>
  <div class="seat-summary">
    <div><strong id="totalSeat">0</strong>总座位</div>

  </div>

  <p class="seat-notice">如需预约请联系管理员（电话：<a href="tel:15912382652" class="tel-link">15912382652</a>/微信：<span class="wx-copy" data-wx="jc_qingyun">jc_qingyun</span>）</p>

  <div class="seat-map-wrap">
   <svg id="seatMap" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <rect x="20" y="20" width="760" height="560" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="20" y="20" width="760" height="40" fill="#e0f2fe" stroke="#94a3b8" stroke-width="1"/>
  <text x="400" y="46" text-anchor="middle" font-size="18" fill="#0369a1">窗户</text>
  <line x1="20" y1="340" x2="780" y2="340" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="480" y1="60" x2="480" y2="340" stroke="#cbd5e1" stroke-width="2"/>
  <text x="250" y="190" text-anchor="middle" font-size="40" fill="#cbd5e1" font-weight="bold">A 区</text>
  <text x="610" y="190" text-anchor="middle" font-size="40" fill="#cbd5e1" font-weight="bold">B 区</text>
  <text x="400" y="470" text-anchor="middle" font-size="48" fill="#e2e8f0" font-weight="bold">大 厅</text>
  <rect x="400" y="340" width="80" height="20" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="440" y="355" text-anchor="middle" font-size="14" fill="#475569">门</text>
  <rect x="480" y="340" width="80" height="20" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="520" y="355" text-anchor="middle" font-size="14" fill="#475569">门</text>
</svg>
  </div>

  <div class="seat-legend">
    <span><span class="dot available"></span> 可选</span>
    <span><span class="dot occupied"></span> 已占用</span>
    <span><span class="dot maintenance"></span> 维护中</span>
  </div>
</div>

<div class="seat-tooltip" id="seatTip"></div>

<script>
let refreshTimer = null;

async function loadSeatMap() {
    const svg = document.getElementById("seatMap");
    const totalEl = document.getElementById("totalSeat");
    const availableEl = document.getElementById("availableSeat");
    const occupiedEl = document.getElementById("occupiedSeat");
    const tipEl = document.getElementById("seatTip");

    try {
      const res = await fetch("/seats");
      const result = await res.json();
      if (!result.success) throw new Error(result.errMsg);

      totalEl.textContent = result.total;
      availableEl.textContent = result.available;
      occupiedEl.textContent = result.occupied;

      svg.querySelectorAll(".seat-group").forEach(el => el.remove());
      // DocumentFragment：内存中批量创建DOM，只一次性插入真实DOM
      const frag = document.createDocumentFragment();

      result.list.forEach(seat => {
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.setAttribute("class", "seat-group");
        g.setAttribute("data-seat", seat.seat_no);
        g.setAttribute("data-status", seat.status);
        // 将座位原始数据挂载到DOM，事件委托读取
        g.dataset.seatData = JSON.stringify(seat);

        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("x", seat.pos_x);
        rect.setAttribute("y", seat.pos_y);
        rect.setAttribute("width", "50");
        rect.setAttribute("height", "60");
        rect.setAttribute("rx", "4");
        rect.setAttribute("class", `seat seat-${seat.status}`);
        g.appendChild(rect);

        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", seat.pos_x + 25);
        text.setAttribute("y", seat.pos_y + 36);
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("font-size", "14");
        text.setAttribute("fill", "#ffffff");
        text.setAttribute("pointer-events", "none");
        text.setAttribute("font-weight", "50");
        text.textContent = seat.seat_no;
        g.appendChild(text);

        frag.appendChild(g);
      });
      // 全部节点生成完成后一次性挂载，仅一次重排
      svg.appendChild(frag);

    } catch (err) {
      console.error("座位图加载失败:", err);
      totalEl.textContent = "-";
      availableEl.textContent = "-";
      occupiedEl.textContent = "-";
    }
}

// 事件委托：只给svg根节点绑定鼠标事件，而不是每个座位
(function setupSvgDelegate(){
    const svg = document.getElementById("seatMap");
    const tipEl = document.getElementById("seatTip");
    let moveTimer = null;
    let hideTimer = null;

    svg.addEventListener("mousemove", (e)=>{
        const targetG = e.target.closest(".seat-group");
        clearTimeout(moveTimer);
        clearTimeout(hideTimer);
        if(!targetG){
            tipEl.classList.remove("active");
            return;
        }
        tipEl.classList.add("active");
        moveTimer = setTimeout(()=>{
            const seat = JSON.parse(targetG.dataset.seatData);
            const statusText = {
              available: "可选",
              occupied: "已占用",
              maintenance: "维护中"
            }[seat.status] || seat.status;

            let html = `<div><span class="label">座位：</span>${seat.seat_no}</div>
                        <div><span class="label">状态：</span>${statusText}</div>`;
            if (seat.status === "occupied" && seat.occupy_start && seat.occupy_end) {
              html += `<div><span class="label">占用时段：</span>${new Date(seat.occupy_start).toLocaleDateString()} ~ ${new Date(seat.occupy_end).toLocaleDateString()}</div>`;
            }
            tipEl.innerHTML = html;

            const offsetX = 12;
            const offsetY = 12;
            let tipX = e.clientX + offsetX;
            let tipY = e.clientY + offsetY;

            tipEl.style.left = "-9999px";
            tipEl.style.top = "-9999px";
            const tipRect = tipEl.getBoundingClientRect();

            if (tipX + tipRect.width > window.innerWidth) {
                tipX = e.clientX - tipRect.width - offsetX;
            }
            if (e.clientY > window.innerHeight / 2) {
                tipY = e.clientY - tipRect.height - offsetY;
            } else {
                tipY = e.clientY + offsetY;
            }
            tipEl.style.left = tipX + "px";
            tipEl.style.top = tipY + "px";
        },16);
    })

    svg.addEventListener("mouseleave",()=>{
        clearTimeout(moveTimer);
        hideTimer = setTimeout(()=>{
            tipEl.classList.remove("active");
        },120)
    })
})();

// DOM解析完成，浏览器空闲后才执行第一次座位加载
document.addEventListener("DOMContentLoaded", ()=>{
    requestIdleCallback(()=>{
        loadSeatMap();
        // 启动轮询
        refreshTimer = setInterval(loadSeatMap, 30000);
    })

    // 页面可见性控制
    document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
            clearInterval(refreshTimer);
        } else {
            refreshTimer = setInterval(loadSeatMap, 30000);
            loadSeatMap();
        }
    });
})

</script>

<script>
document.addEventListener('DOMContentLoaded',()=>{
    const wxEl = document.querySelector('.wx-copy');
    const toast = document.createElement('div');
    toast.className = "copy-toast";
    toast.innerText = "微信号已复制！前往微信粘贴";
    document.body.appendChild(toast);

    wxEl.addEventListener('click',async ()=>{
        const wxNum = wxEl.dataset.wx;
        try{
            await navigator.clipboard.writeText(wxNum);
        }catch{
            const tempInput = document.createElement("input");
            tempInput.value = wxNum;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
        }
        toast.classList.add('show');
        setTimeout(()=>toast.classList.remove('show'),1800);
    })
})
</script>
