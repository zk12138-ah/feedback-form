<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青云自习室 - 座位实时查询</title>
<style>
   * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, sans-serif;
    }

  
  .seat-map-section {
    max-width: 820px;
    margin: 40px auto;
    padding: 32px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 4px 18px rgba(0, 80, 180, 0.08);
  }
  .seat-map-section h3 {
    color: #1a4b94;
    font-size: 22px;
    margin-bottom: 8px;
  }
  .seat-summary {
    display: flex;
    gap: 24px;
    margin-bottom: 20px;
    color: #555;
    font-size: 15px;
  }
  .seat-summary strong {
    color: #1a4b94;
    font-size: 18px;
    margin-right: 4px;
  }
  .seat-map-wrap {
    width: 100%;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    background: #f8fafc;
    overflow: hidden;
  }
  #seatMap {
    width: 100%;
    height: auto;
    display: block;
  }
    .seat {
    cursor: pointer;
    /* 延长过渡时间，更加顺滑 */
    transition: transform 0.22s ease-out, opacity 0.2s ease;
    transform-origin: center center;
  }
  .seat:hover {
    /* 缩小放大幅度，不突兀 */
    transform: scale(1.035);
  }
  .seat-available { fill: #22c55e; stroke: #16a34a; stroke-width: 2; }
  .seat-occupied { fill: #ef4444; stroke: #dc2626; stroke-width: 2; }
  .seat-maintenance { fill: #94a3b8; stroke: #64748b; stroke-width: 2; }

  .seat-legend {
    display: flex;
    gap: 24px;
    margin-top: 16px;
    font-size: 14px;
    color: #475569;
    justify-content: center;
  }
  .seat-legend .dot {
    display: inline-block;
    width: 14px;
    height: 14px;
    border-radius: 3px;
    margin-right: 6px;
    vertical-align: middle;
  }
  .dot.available { background: #22c55e; }
  .dot.occupied { background: #ef4444; }
  .dot.maintenance { background: #94a3b8; }

 .seat-tooltip {
    position: fixed;
    background: rgba(15, 23, 42, 0.92);
    color: #fff;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.6;
    pointer-events: none;
    z-index: 999;
    /* 增加淡入淡出 */
    opacity: 0;
    transition: opacity 0.18s ease;
    white-space: nowrap;
                }
  .seat-tooltip.active {
    display: block;
    opacity: 1;
                      }
  .seat-tooltip .label { color: #94a3b8; margin-right: 6px; }
</style>

<style>
  .hot-service {
    max-width: 720px;
    margin: 0 auto 32px;
    padding: 32px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 4px 18px rgba(0, 80, 180, 0.08);
  }
  .hot-service h3 {
    color: #1a4b94;
    font-size: 22px;
    margin-bottom: 24px;
  }
  .service-list {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .service-item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 20px;
    background: #f8fafc;
    border-radius: 12px;
    border-left: 4px solid #2b6bcd;
  }
  .service-item .icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #e0f2fe;
    color: #0369a1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: bold;
    flex-shrink: 0;
  }
  .service-item .text h4 {
    color: #1a4b94;
    font-size: 18px;
    margin-bottom: 4px;
  }
  .service-item .text p {
    color: #64748b;
    font-size: 14px;
    margin: 0;
  }
</style>
</head>
<body>

<div class="hot-service">
  <h3>热门服务</h3>
  <div class="service-list">
    <div class="service-item">
      <div class="icon">座</div>
      <div class="text">
        <h4>智能选座 一键预约（线上预约功能正在开发中，敬请期待！！）</h4>
        <p>请联系管理员预约座位（电话：15912382652/微信号：jc_qingyun）</p>
      </div>
    </div>
    <div class="service-item">
      <div class="icon">铃</div>
      <div class="text">
        <h4>超时提醒 贴心服务（暂未上线！！！敬请期待！！！）</h4>
        <p>座位使用即将到期自动提醒，避免超时占用</p>
      </div>
    </div>
  </div>
</div>

<div class="seat-map-section">
  <h3>自习室座位实时状态</h3>
  <div class="seat-summary">
    <div><strong id="totalSeat">0</strong>总座位</div>
    <div><strong id="availableSeat">0</strong>剩余可选</div>
    <div><strong id="occupiedSeat">0</strong>已占用</div>
  </div>

  <div class="seat-map-wrap">
   <svg id="seatMap" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 整体外框 -->
  <rect x="20" y="20" width="760" height="560" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- 顶部窗户 -->
  <rect x="20" y="20" width="760" height="40" fill="#e0f2fe" stroke="#94a3b8" stroke-width="1"/>
  <text x="400" y="46" text-anchor="middle" font-size="18" fill="#0369a1">窗户</text>

  <!-- 自习区与大厅分隔【向下移动】 -->
  <line x1="20" y1="340" x2="780" y2="340" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- A/B区分隔（B区更窄） -->
  <line x1="480" y1="60" x2="480" y2="340" stroke="#cbd5e1" stroke-width="2"/>
  <text x="250" y="190" text-anchor="middle" font-size="40" fill="#cbd5e1" font-weight="bold">A 区</text>
  <text x="610" y="190" text-anchor="middle" font-size="40" fill="#cbd5e1" font-weight="bold">B 区</text>

  <!-- 大厅 -->
  <text x="400" y="470" text-anchor="middle" font-size="48" fill="#e2e8f0" font-weight="bold">大 厅</text>

  <!-- 两个门，下移对齐横线，右门右移 -->
  <rect x="400" y="340" width="80" height="20" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="440" y="355" text-anchor="middle" font-size="14" fill="#475569">门</text>
  <rect x="480" y="340" width="80" height="20" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="520" y="355" text-anchor="middle" font-size="14" fill="#475569">门</text>

  <!-- 座位由JS动态生成 -->
</svg>
  </div>

  <div class="seat-legend">
    <span><span class="dot available"></span> 可选</span>
    <span><span class="dot occupied"></span> 已占用</span>
    <span><span class="dot maintenance"></span> 维护中</span>
  </div>
</div>

<div class="seat-tooltip" id="seatTip"></div>

<script>
async function loadSeatMap() {
    const svg = document.getElementById("seatMap");
    const totalEl = document.getElementById("totalSeat");
    const availableEl = document.getElementById("availableSeat");
    const occupiedEl = document.getElementById("occupiedSeat");
    const tipEl = document.getElementById("seatTip");

    let moveTimer = null;
    let hideTimer = null;

    try {
      const res = await fetch("/seats");
      const result = await res.json();
      if (!result.success) throw new Error(result.errMsg);

      totalEl.textContent = result.total;
      availableEl.textContent = result.available;
      occupiedEl.textContent = result.occupied;

      svg.querySelectorAll(".seat-group").forEach(el => el.remove());

      result.list.forEach(seat => {
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.setAttribute("class", "seat-group");
        g.setAttribute("data-seat", seat.seat_no);
        g.setAttribute("data-status", seat.status);
        g.setAttribute("data-customer", seat.customer_id || "");
        g.setAttribute("data-start", seat.occupy_start ? new Date(seat.occupy_start).toLocaleDateString() : "");
        g.setAttribute("data-end", seat.occupy_end ? new Date(seat.occupy_end).toLocaleDateString() : "");

        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("x", seat.pos_x);
        rect.setAttribute("y", seat.pos_y);
        rect.setAttribute("width", "50");
        rect.setAttribute("height", "60");
        rect.setAttribute("rx", "4");
        rect.setAttribute("class", `seat seat-${seat.status}`);
        g.appendChild(rect);

        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", seat.pos_x + 25);
        text.setAttribute("y", seat.pos_y + 36);
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("font-size", "14");
        text.setAttribute("fill", "#ffffff");
        text.setAttribute("pointer-events", "none");
        text.setAttribute("font-weight", "500");
        text.textContent = seat.seat_no;
        g.appendChild(text);

        g.addEventListener("mousemove", e => {
          clearTimeout(moveTimer);
          clearTimeout(hideTimer);
          tipEl.classList.add("active");

          moveTimer = setTimeout(() => {
            const statusText = {
              available: "可选",
              occupied: "已占用",
              maintenance: "维护中"
            }[seat.status] || seat.status;

            let html = `<div><span class="label">座位：</span>${seat.seat_no}</div>
                        <div><span class="label">状态：</span>${statusText}</div>`;
            // 只判断时间，不再读取客户编号
            if (seat.status === "occupied" && seat.occupy_start && seat.occupy_end) {
              html += `<div><span class="label">占用时段：</span>${new Date(seat.occupy_start).toLocaleDateString()} ~ ${new Date(seat.occupy_end).toLocaleDateString()}</div>`;
            }
            tipEl.innerHTML = html;

let offsetX = 12;
let offsetY = 12;
let tipX = e.clientX + offsetX;
let tipY = e.clientY + offsetY;

// 先临时渲染获取弹窗尺寸
tipEl.style.left = "-9999px";
tipEl.style.top = "-9999px";
tipEl.classList.add("active");
const tipRect = tipEl.getBoundingClientRect();

// 横向边界判断
if (tipX + tipRect.width > window.innerWidth) {
    tipX = e.clientX - tipRect.width - offsetX;
}

// 纵向智能判断：下半屏幕 → 弹窗向上，避免遮挡座位
if (e.clientY > window.innerHeight / 2) {
    tipY = e.clientY - tipRect.height - offsetY;
} else {
    tipY = e.clientY + offsetY;
}

tipEl.style.left = tipX + "px";
tipEl.style.top = tipY + "px";

            tipEl.style.left = tipX + "px";
            tipEl.style.top = tipY + "px";
          }, 16);
        });

        g.addEventListener("mouseleave", () => {
          clearTimeout(moveTimer);
          hideTimer = setTimeout(() => {
            tipEl.classList.remove("active");
          }, 120);
        });

        svg.appendChild(g);
      });

    } catch (err) {
      console.error("座位图加载失败:", err);
      totalEl.textContent = "-";
      availableEl.textContent = "-";
      occupiedEl.textContent = "-";
    }
  }

  loadSeatMap();

  // 30秒自动刷新
  const refreshTimer = setInterval(loadSeatMap, 30000);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      clearInterval(refreshTimer);
    } else {
      loadSeatMap();
    }
  });
</script>
  <div class="copyright" style="text-align:center;color:#666;font-size:13px;padding:20px 10px;">
    © 2026 青云自习室 保留所有权利
    <p style="margin-top:6px;">网站原创内容著作权归本站所有；第三方服务、商标归属对应服务商。</p>
</div>
</body>
</html>
