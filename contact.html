<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>找到我们 | 青云自习室</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #f8fafe;
            padding: 30px 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .back-btn {
            display: inline-block;
            text-decoration: none;
            color:#1a3480;
            font-size:16px;
            margin-bottom:24px;
        }
        .title-box {
            text-align:center;
            margin-bottom:26px;
        }
        .title-box h1{
            color:#1a3480;
            font-size:32px;
            letter-spacing:2px;
        }
        .content-card {
            background:#ffffff;
            border-radius:16px;
            padding:28px;
            box-shadow:0 2px 12px rgba(0,0,0,0.06);
        }
        .address-title {
            display:flex;
            align-items:center;
            font-size:28px;
            color:#1a3480;
            margin-bottom:16px;
            gap:10px;
        }
        .address-tip {
            font-size:20px;
            color:#333;
            margin-bottom:24px;
        }
        /*导航主按钮*/
        .map-btn {
            width: 100%;
            padding:16px;
            background:#3488eb;
            color:#fff;
            border:none;
            border-radius:14px;
            font-size:18px;
            cursor:pointer;
            transition: transform 0.22s ease, background 0.22s ease;
        }
        .map-btn:hover {
            background:#2777d4;
            transform: translateY(-2px);
        }
        .map-btn:active {
            transform: scale(0.97);
        }

        /* ===== 双视频布局【修复视频裁切】 ===== */
        .video-tip{
            margin:18px 0 12px;
            font-size:15px;
            color:#666;
            text-align:center;
        }
        .video-wrap{
            display:flex;
            gap:12px;
        }
        .video-item{
            flex:1;
        }
        .location-video{
            width:100%;
            border-radius:14px;
            background:#f0f4fc;
            display:block;
            /* 关键修复：contain 完整显示画面，不裁切 */
            object-fit: contain;
            background-color:#f0f4fc;
        }
        /* 手机窄屏自动上下堆叠 */
        @media (max-width:420px){
            .video-wrap{
                flex-direction:column;
            }
        }

        .div-line {
            height:1px;
            background:#e2e8f0;
            margin:30px 0;
        }
        .contact-item {
            font-size:17px;
            line-height:1.8;
            color:#333;
            margin-bottom:12px;
        }

        /* ========== 地图选择弹窗样式 ========== */
        .mask-layer {
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.55);
            display:none;
            z-index:999;
            align-items:flex-end;
            justify-content:center;
        }
        .popup-box {
            width:100%;
            max-width:600px;
            background:#fff;
            border-radius:18px 18px 0 0;
            overflow:hidden;
        }
        .popup-title{
            text-align:center;
            padding:20px;
            font-size:19px;
            color:#222;
            border-bottom:1px solid #eee;
        }
        .map-item{
            width:100%;
            padding:18px;
            text-align:center;
            border:none;
            background:#fff;
            font-size:18px;
            cursor:pointer;
            border-bottom:1px solid #eee;
        }
        .map-item:active{
            background:#f0f4fc;
        }
        .cancel-btn{
            width:100%;
            padding:18px;
            text-align:center;
            border:none;
            background:#fff;
            font-size:18px;
            color:#666;
            cursor:pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="./index.html" class="back-btn">← 返回首页</a>
        <div class="title-box">
            <h1>联系我们</h1>
        </div>

        <div class="content-card">
            <div class="address-title">
                <span>📍</span>
                <span>门店地址</span>
            </div>
            <div class="address-tip">【百度地图搜索：青云自习室】</div>

            <!--唤起弹窗按钮-->
            <button class="map-btn" id="openMapPopup">📍 点击一键导航前往</button>

            <!-- ========== 双视频并列区域 ========== -->
            <p class="video-tip">导航无法唤起？观看门店指引视频（注：若电脑端视频无法看到画面，请尝试在移动端查看）</p>
            <div class="video-wrap">
                <div class="video-item">
                    <video class="location-video" controls preload="metadata">
                        <source src="video1.mp4" type="video/mp4">
                    </video>
                </div>
                <div class="video-item">
                    <video class="location-video" controls preload="metadata">
                        <source src="video2.mp4" type="video/mp4">
                    </video>
                </div>
            </div>

            <div class="div-line"></div>

            <div class="contact-item">☎ 咨询电话：【15912382652】</div>
            <div class="contact-item">⏰ 营业时间：【7：00~23：00】</div>
            <div class="contact-item">💬 微信客服：【jc_qingyun】</div>
        </div>
    </div>

    <!--地图选择弹窗 -->
    <div class="mask-layer" id="mask">
        <div class="popup-box">
            <div class="popup-title">请选择导航软件</div>
            <button class="map-item" data-type="baidu">🗺️ 百度地图</button>
            <button class="map-item" data-type="amap">🚗 高德地图</button>
            <button class="map-item" data-type="tencent">🌐 腾讯地图</button>
            <button class="cancel-btn" id="closePopup">取消</button>
        </div>
    </div>

<script>
// ========== 修改自习室完整地址！！ ==========
const DEST_ADDRESS = "青云自习室";
//建议填写完整地址：青云自习室 玉溪市XX区XX街道XX号

const mask = document.getElementById('mask');
const openBtn = document.getElementById('openMapPopup');
const closeBtn = document.getElementById('closePopup');
const mapButtons = document.querySelectorAll('.map-item');

//打开弹窗
openBtn.addEventListener('click',()=>{
    mask.style.display = 'flex';
})
//关闭弹窗
closeBtn.addEventListener('click',()=>{
    mask.style.display = 'none';
})

//点击空白遮罩关闭弹窗
mask.addEventListener('click',(e)=>{
    if(e.target === mask){
        mask.style.display = 'none';
    }
})

//跳转导航逻辑
mapButtons.forEach(btn=>{
    btn.addEventListener('click',()=>{
        const type = btn.dataset.type;
        const address = encodeURIComponent(DEST_ADDRESS);
        let schemeUrl, webUrl;

        switch(type){
            case "baidu":
                schemeUrl = `baidumap://map/search?q=${address}`;
                webUrl = `https://map.baidu.com/search/?q=${address}`;
                break;
            case "amap":
                schemeUrl = `amapuri://search/search?keyword=${address}`;
                webUrl = `https://amap.com/search?keyword=${address}`;
                break;
            case "tencent":
                schemeUrl = `qqmap://map/search?keyword=${address}`;
                webUrl = `https://map.qq.com/m/search?keyword=${address}`;
                break;
        }

        mask.style.display = 'none';
        window.location.href = schemeUrl;
        setTimeout(()=>{
            window.location.href = webUrl;
        }, 350);
    })
})
</script>
</body>
</html>
