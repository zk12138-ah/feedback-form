<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0">
    <title>座位管理后台 - 青云自习室</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, sans-serif;
        }
        body {
            background: #f0f7ff;
            padding: 20px 12px;
            min-height: 100vh;
        }
        .container {
            max-width: 820px;
            margin: 0 auto;
            background: #fff;
            padding: 20px 16px;
            border-radius: 16px;
            box-shadow: 0 4px 18px rgba(0, 80, 180, 0.08);
        }
        h2 {
            color: #1a4b94;
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .login-box {
            max-width: 360px;
            margin: 40px auto;
        }
        .login-box input {
            width: 100%;
            padding: 14px 14px;
            border: 1px solid #d0e0f5;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 16px;
            outline: none;
        }
        .login-box input:focus { border-color: #3678d3; }
        .btn {
            width: 100%;
            padding: 14px;
            background: #2b6bcd;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: #1e5ab8; }
        .btn:disabled { background: #80a8e0; cursor: not-allowed; }

        .seat-panel { display: none; }
        .seat-panel.active { display: block; }

        .seat-summary {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
            color: #555;
            font-size: 15px;
            flex-wrap: wrap;
        }
        .seat-summary strong {
            color: #1a4b94;
            font-size: 18px;
            margin-right: 4px;
        }
        .seat-map-wrap {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: #f8fafc;
            overflow-x: auto;
            touch-action: manipulation;
        }
        #seatMap {
            width: 100%;
            min-width: 600px;
            height: auto;
            display: block;
        }
        .seat {
            cursor: pointer;
            transition: transform 0.22s ease-out, opacity 0.2s ease;
            transform-origin: center center;
        }
        .seat:hover {
            transform: scale(1.035);
        }
        .seat-available { fill: #22c55e; stroke: #16a34a; stroke-width: 2; }
        .seat-occupied { fill: #ef4444; stroke: #dc2626; stroke-width: 2; }
        .seat-maintenance { fill: #94a3b8; stroke: #64748b; stroke-width: 2; }

        .seat-legend {
            display: flex;
            gap: 16px;
            margin-top: 16px;
            font-size: 14px;
            color: #475569;
            justify-content: center;
            flex-wrap: wrap;
        }
        .seat-legend .dot {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 3px;
            margin-right: 6px;
            vertical-align: middle;
        }
        .dot.available { background: #22c55e; }
        .dot.occupied { background: #ef4444; }
        .dot.maintenance { background: #94a3b8; }

        .status-menu {
            position: fixed;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            padding: 8px 0;
            z-index: 999;
            display: none;
            min-width: 160px;
        }
        .status-menu.active { display: block; }
        .status-menu .item {
            padding: 10px 16px;
            cursor: pointer;
            font-size: 14px;
        }
        .status-menu .item:hover { background: #f1f5f9; }
        .status-menu .divider {
            height: 1px;
            background: #e2e8f0;
            margin: 6px 0;
        }
        /* 移动端隐藏桌面右键菜单 */
        @media (max-width:640px){
            .status-menu{
                display:none !important;
            }
        }

        /* 占用设置弹窗 */
        .occupy-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .occupy-modal.active { display: flex; }
        .modal-box {
            background: #fff;
            padding: 24px 20px;
            border-radius: 12px;
            width: 92%;
            max-width: 360px;
        }
        .modal-box h4 {
            color: #1a4b94;
            margin-bottom: 16px;
            font-size: 18px;
        }
        .modal-box label {
            display: block;
            font-size: 14px;
            color: #475569;
            margin-bottom: 6px;
            margin-top: 12px;
        }
        .modal-box input {
            width: 100%;
            padding: 12px 12px;
            border: 1px solid #d0e0f5;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }
        .modal-box input:focus { border-color: #3678d3; }
        .modal-btns {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .modal-btns .btn-cancel {
            flex: 1;
            padding: 12px;
            background: #f1f5f9;
            color: #475569;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size:16px;
        }
        .modal-btns .btn-confirm {
            flex: 1;
            padding: 12px;
            background: #2b6bcd;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size:16px;
        }

        .tip {
            text-align: center;
            color: #64748b;
            font-size: 13px;
            margin-top: 16px;
        }
        .toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            background: rgba(0,0,0,0.75);
            color: #fff;
            border-radius: 8px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 2000;
        }
        .toast.show { opacity: 1; }

        /* ========== 移动端底部抽屉 新增 ========== */
        .drawer-mask{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.4);
            z-index:998;
            display:none;
        }
        .drawer-mask.show{
            display:block;
        }
        .drawer-box{
            position:fixed;
            left:0;
            bottom:0;
            width:100%;
            max-width:820px;
            margin:0 auto;
            background:#fff;
            border-radius:16px 16px 0 0;
            padding:24px 20px 32px;
            z-index:999;
            transform:translateY(100%);
            transition:transform 0.25s ease;
        }
        .drawer-mask.show .drawer-box{
            transform:translateY(0);
        }
        .drawer-handle{
            width:40px;
            height:4px;
            background:#ddd;
            border-radius:99px;
            margin:0 auto 16px;
        }
        .drawer-info{
            line-height:1.8;
            font-size:15px;
            margin-bottom:20px;
        }
        .drawer-btn-group{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:12px;
        }
        .drawer-btn{
            padding:13px;
            border-radius:10px;
            border:none;
            font-size:15px;
            cursor:pointer;
        }
        .btn-opt1{background:#22c55e;color:#fff;}
        .btn-opt2{background:#94a3b8;color:#fff;}
        .btn-opt3{grid-column:1/-1;background:#2b6bcd;color:#fff;}
    </style>
</head>
<body>
    <div class="container">
        <h2>自习室座位管理后台</h2>

        <div class="login-box" id="loginBox">
            <input type="password" id="adminPwd" placeholder="请输入管理员密码">
            <button class="btn" onclick="verifyAdmin()">进入管理</button>
        </div>

        <div class="seat-panel" id="seatPanel">
            <div class="seat-summary">
                <div><strong id="totalSeat">0</strong>总座位</div>
                <div><strong id="availableSeat">0</strong>剩余可选</div>
                <div><strong id="occupiedSeat">0</strong>已占用</div>
            </div>
            <div class="seat-map-wrap">
                <svg id="seatMap" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
                    <!-- 整体外框 -->
                    <rect x="20" y="20" width="760" height="560" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
                    <!-- 顶部窗户 -->
                    <rect x="20" y="20" width="760" height="40" fill="#e0f2fe" stroke="#94a3b8" stroke-width="1"/>
                    <text x="400" y="46" text-anchor="middle" font-size="18" fill="#0369a1">窗户</text>
                    <!-- 自习区与大厅分隔 -->
                    <line x1="20" y1="340" x2="780" y2="340" stroke="#cbd5e1" stroke-width="2"/>
                    <!-- A/B区分隔 -->
                    <line x1="480" y1="60" x2="480" y2="340" stroke="#cbd5e1" stroke-width="2"/>
                    <text x="250" y="190" text-anchor="middle" font-size="40" fill="#cbd5e1" font-weight="bold">A 区</text>
                    <text x="610" y="190" text-anchor="middle" font-size="40" fill="#cbd5e1" font-weight="bold">B 区</text>
                    <!-- 大厅 -->
                    <text x="400" y="470" text-anchor="middle" font-size="48" fill="#e2e8f0" font-weight="bold">大 厅</text>
                    <!-- 两个门 -->
                    <rect x="400" y="340" width="80" height="20" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
                    <text x="440" y="355" text-anchor="middle" font-size="14" fill="#475569">门</text>
                    <rect x="480" y="340" width="80" height="20" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
                    <text x="520" y="355" text-anchor="middle" font-size="14" fill="#475569">门</text>
                </svg>
            </div>

            <div class="seat-legend">
                <span><span class="dot available"></span> 可选</span>
                <span><span class="dot occupied"></span> 已占用</span>
                <span><span class="dot maintenance"></span> 维护中</span>
            </div>
            <p class="tip">点击座位选择操作</p>
        </div>
    </div>

    <!-- PC端右键菜单 -->
    <div class="status-menu" id="statusMenu">
        <div class="item" onclick="setSeatStatus('available')">设为可选</div>
        <div class="item" onclick="setSeatStatus('maintenance')">设为维护中</div>
        <div class="divider"></div>
        <div class="item" onclick="openOccupyForm()">设置占用（录入客户信息）</div>
    </div>

    <!-- 移动端底部抽屉 -->
    <div class="drawer-mask" id="drawerMask">
        <div class="drawer-box">
            <div class="drawer-handle"></div>
            <div class="drawer-info" id="drawerInfo"></div>
            <div class="drawer-btn-group">
                <button class="drawer-btn btn-opt1" onclick="setSeatStatus('available');closeDrawer()">设为可选</button>
                <button class="drawer-btn btn-opt2" onclick="setSeatStatus('maintenance');closeDrawer()">设为维护</button>
                <button class="drawer-btn btn-opt3" onclick="closeDrawer();openOccupyForm()">设置占用（录入客户）</button>
            </div>
        </div>
    </div>

    <!-- 占用信息弹窗 -->
    <div class="occupy-modal" id="occupyModal">
        <div class="modal-box">
            <h4>设置座位占用</h4>
            <label>客户编号</label>
            <input type="text" id="customerId" placeholder="请输入客户编号">
            <label>占用开始日期</label>
            <input type="date" id="occupyStart">
            <label>占用结束日期</label>
            <input type="date" id="occupyEnd">
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeOccupyForm()">取消</button>
                <button class="btn-confirm" onclick="submitOccupy()">确认设置</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let currentSeatNo = "";
        let currentSeatData = null;
        let adminPassword = "";
        const drawerMask = document.getElementById("drawerMask");

        // 点击遮罩关闭抽屉
        drawerMask.addEventListener("click",(e)=>{
            if(e.target === drawerMask) closeDrawer();
        })
        function closeDrawer(){
            drawerMask.classList.remove("show");
        }

        function showToast(text) {
            const toast = document.getElementById("toast");
            toast.innerText = text;
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 2000);
        }

        // ========== 【修复：真正的密码校验登录】 ==========
        function verifyAdmin() {
            const pwd = document.getElementById("adminPwd").value.trim();
            if (!pwd) { showToast("请输入管理员密码"); return; }
            adminPassword = pwd;
            
            // 携带密码请求座位接口，通过接口返回结果校验密码正确性
            loadSeatData().then(() => {
                document.getElementById("loginBox").style.display = "none";
                document.getElementById("seatPanel").classList.add("active");
                showToast("登录成功");
                setInterval(loadSeatData, 20000);
            }).catch(err => {
                // 密码错误/校验失败，停留在登录页，不显示后台
                adminPassword = "";
                showToast(err.message || "密码错误，请重试");
            });
        }

        // ========== 【修复：请求座位数据必须携带管理员密码】 ==========
        async function loadSeatData() {
            // 必须携带密码，才能触发后端管理员校验，获取完整数据
            const res = await fetch(`/seats?password=${encodeURIComponent(adminPassword)}`);
            const result = await res.json();
            if (!result.success) throw new Error(result.errMsg || "数据加载失败");

            document.getElementById("totalSeat").textContent = result.total;
            document.getElementById("availableSeat").textContent = result.available;
            document.getElementById("occupiedSeat").textContent = result.occupied;

            const svg = document.getElementById("seatMap");
            svg.querySelectorAll(".seat-group").forEach(el => el.remove());

            result.list.forEach(seat => {
                const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
                g.setAttribute("class", "seat-group");
                g.setAttribute("data-seat", seat.seat_no);

                const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                rect.setAttribute("x", seat.pos_x);
                rect.setAttribute("y", seat.pos_y);
                rect.setAttribute("width", "50");
                rect.setAttribute("height", "60");
                rect.setAttribute("rx", "4");
                rect.setAttribute("class", `seat seat-${seat.status}`);
                g.appendChild(rect);

                const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                text.setAttribute("x", seat.pos_x + 25);
                text.setAttribute("y", seat.pos_y + 36);
                text.setAttribute("text-anchor", "middle");
                text.setAttribute("font-size", "14");
                text.setAttribute("fill", "#ffffff");
                text.setAttribute("pointer-events", "none");
                text.setAttribute("font-weight", "50");
                text.textContent = seat.seat_no;
                g.appendChild(text);

                // 点击座位 区分PC/移动端
                g.addEventListener("click", e => {
                    e.stopPropagation();
                    currentSeatNo = seat.seat_no;
                    currentSeatData = seat;
                    const statusText = {
                        available: "可选",
                        occupied: "已占用",
                        maintenance: "维护中"
                    }[seat.status] || seat.status;

                    // 判断是否移动端
                    const isMobile = window.innerWidth <= 640;
                    if(isMobile){
                        // 移动端：打开底部抽屉
                        let infoHtml = `<div><strong>座位：${seat.seat_no}</strong></div>
                        <div>状态：${statusText}</div>`;
                        if(seat.status === "occupied" && seat.customer_id){
                            infoHtml += `<div>客户编号：${seat.customer_id}</div>
                            <div>占用时段：${new Date(seat.occupy_start).toLocaleDateString()} ~ ${new Date(seat.occupy_end).toLocaleDateString()}</div>`;
                        }
                        document.getElementById("drawerInfo").innerHTML = infoHtml;
                        drawerMask.classList.add("show");
                    }else{
                        // PC端：原有右键菜单
                        const menu = document.getElementById("statusMenu");
                        menu.style.left = e.clientX + "px";
                        menu.style.top = e.clientY + "px";
                        menu.classList.add("active");
                    }
                });
                svg.appendChild(g);
            });
        }

        // 点击空白关闭菜单
        document.addEventListener("click", () => {
            document.getElementById("statusMenu").classList.remove("active");
        });

        // 直接设置状态
        async function setSeatStatus(status) {
            if (!currentSeatNo) return;
            try {
                const res = await fetch("/update-seat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ seat_no: currentSeatNo, status, password: adminPassword })
                });
                const result = await res.json();
                if (!result.success) throw new Error(result.errMsg);
                showToast("更新成功");
                loadSeatData();
            } catch (err) {
                showToast(err.message || "更新失败");
            }
        }

        // 打开占用表单
        function openOccupyForm() {
            document.getElementById("statusMenu").classList.remove("active");
            document.getElementById("customerId").value = "";
            document.getElementById("occupyStart").value = "";
            document.getElementById("occupyEnd").value = "";
            document.getElementById("occupyModal").classList.add("active");
        }

        function closeOccupyForm() {
            document.getElementById("occupyModal").classList.remove("active");
        }

        // 提交占用设置
        async function submitOccupy() {
            const customerId = document.getElementById("customerId").value.trim();
            const start = document.getElementById("occupyStart").value;
            const end = document.getElementById("occupyEnd").value;

            if (!customerId || !start || !end) {
                showToast("请填写完整信息");
                return;
            }
            if (new Date(end) < new Date(start)) {
                showToast("结束日期不能早于开始日期");
                return;
            }

            try {
                const res = await fetch("/update-seat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        seat_no: currentSeatNo,
                        status: "occupied",
                        customer_id: customerId,
                        occupy_start: new Date(start).toISOString(),
                        occupy_end: new Date(end).toISOString(),
                        password: adminPassword
                    })
                });
                const result = await res.json();
                if (!result.success) throw new Error(result.errMsg);

                showToast("占用设置成功，座位已自动变为已占用");
                closeOccupyForm();
                loadSeatData();
            } catch (err) {
                showToast(err.message || "设置失败");
            }
        }
    </script>

    <div style="padding:12px;background:#f7f8fa;border-radius:8px;margin-bottom:16px;">
      <h4>📊网站访问统计</h4>
      <p>总浏览量(PV)：<span id="busuanzi_value_site_pv">--</span></p>
      <p>总访客数(UV)：<span id="busuanzi_value_site_uv">--</span></p>
    </div>
    
    <div class="copyright" style="text-align:center;color:#666;font-size:13px;padding:20px 10px;">
    © 2026 青云自习室 保留所有权利

</div>

    <!-- 不蒜子访问统计 -->

</body>
</html>
